services:
  resolvedesk:
    environment:
      ACCOUNT_API_URL: http://account-service:8001
    depends_on:
      account-service:
        condition: service_healthy
  account-service:
    build: .
    command: ["uvicorn", "app.account_service:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file: .env
    volumes:
      - account-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  account-data:
